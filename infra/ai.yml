AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Agenda parser: Claude on Bedrock via a Lambda function URL outside the VPC.
  The function receives pasted text and returns JSON; it never writes to Aurora.
  Saving goes through the main API. Tagged with PROJECT_NAME like the rest.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3

Parameters:
  ProjectName:
    Type: String
    Default: successfulsuccess

  ImageUri:
    Type: String
    Description: The backend image digest. ImageConfig points it at the agenda handler.

  Architecture:
    Type: String
    Default: x86_64
    AllowedValues: [x86_64, arm64]

  CorsOrigins:
    Type: String
    Default: "*"
    Description: Comma-separated browser origins allowed to call the parser URL.

  CognitoUserPoolId:
    Type: String

  CognitoClientId:
    Type: String

  ParserModel:
    Type: String
    Default: eu.anthropic.claude-sonnet-4-6
    Description: Bedrock inference-profile id (PARSER_MODEL).

Conditions:
  WildcardCors: !Equals [!Ref CorsOrigins, "*"]

Resources:
  ParserRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: bedrock-converse
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Lab Step 3: "*" for now; narrowing is a discussion question.
              # Converse (not Mantle): Claude Platform / mantle is unsupported on Free.
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:Converse
                  - bedrock:ConverseStream
                Resource: "*"

      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-agenda-parser"
      RetentionInDays: 14
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      Description: Paste-an-agenda parser. Outside the VPC; calls Bedrock; no database.
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.ai.agenda_lambda.handler
      Architectures:
        - !Ref Architecture
      Role: !GetAtt ParserRole.Arn
      MemorySize: 512
      Timeout: 30
      LoggingConfig:
        LogGroup: !Ref ParserLogGroup
      Environment:
        Variables:
          # AWS_REGION is set by Lambda. pydantic-settings maps it to aws_region.
          CORS_ORIGINS: !Ref CorsOrigins
          LOG_LEVEL: INFO
          COGNITO_REGION: !Ref AWS::Region
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          PARSER_MODEL: !Ref ParserModel
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ParserUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ParserFunction.Arn
      AuthType: NONE
      InvokeMode: BUFFERED
      Cors:
        AllowCredentials: false
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - POST
        AllowOrigins: !If
          - WildcardCors
          - ["*"]
          - !Split [",", !Ref CorsOrigins]
        MaxAge: 86400

  ParserUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ParserUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  ParserUrl:
    Description: HTTPS URL of the agenda parser (no trailing slash)
    Value: !Sub ["https://${Host}", {Host: !Select [2, !Split ["/", !GetAtt ParserUrl.FunctionUrl]]}]
  ParserFunctionName:
    Value: !Ref ParserFunction
  ParserLogGroupName:
    Value: !Ref ParserLogGroup
